# Dependabot — automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Design notes (read before editing):
# - Python is a single uv workspace (one root uv.lock) -> ONE pip entry at "/", not one per package.
# - JS is a single pnpm workspace (one root pnpm-lock.yaml) -> ONE npm entry at "/", not one per app.
# - Duplicate per-directory entries against a shared lockfile cause duplicate/near-duplicate PRs.
# - Minor/patch bumps are grouped into a single weekly PR per ecosystem to avoid PR flooding.
# - Major version bumps are intentionally left OUT of the group (update-types only matches
#   minor/patch), so a breaking change always gets its own PR and real review — never silently
#   bundled in with routine patch bumps.

version: 2

updates:
  # ---------- Python (uv workspace — single root lockfile) ----------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------- npm (pnpm workspace — single root lockfile) ----------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      js-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------- Docker ----------
  - package-ecosystem: "docker"
    directory: "/services/identity"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"

  # ---------- GitHub Actions ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"