# =============================================================================
# CI — Secret scan
#
# Safety net for a public repository: scans the full git history for
# credentials/tokens/keys on every push to main/dev and on every PR, so
# accidentally committed secrets are caught before merge. Uses gitleaks with
# its default (extensive) rule set.
# =============================================================================

name: CI — Secret Scan

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-secretscan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked secrets from earlier commits are found too.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
