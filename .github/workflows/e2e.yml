# =============================================================================
# CI - End-to-End Tests (SKY-103)
#
# Boots the full compose cluster (Postgres, Redis, Mailpit, Identity, Core,
# AI-Agent, Nginx), seeds the databases, builds the web app, starts Next.js
# on the host at :3100, and runs Playwright against the nginx origin
# (http://default.localhost:3000 -> Next.js).
#
# Next.js runs on the host (not inside a container) so Playwright can reach
# it via host.docker.internal and so `next start` binds 127.0.0.1:3100.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "services/**"
      - "infra/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "services/**"
      - "infra/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- JWT RSA keys ----------------------------------------------------
      - name: Generate JWT RSA keys
        run: |
          mkdir -p .dev/keys
          openssl genrsa -out .dev/keys/private.pem 2048 2>/dev/null
          openssl rsa -in .dev/keys/private.pem -pubout -out .dev/keys/public.pem 2>/dev/null
          echo "Generated .dev/keys/private.pem + public.pem"

      # ---- Compose up ------------------------------------------------------
      - name: Start compose stack
        run: docker compose -f infra/docker/docker-compose.e2e.yml up -d --build
        timeout-minutes: 15
        env:
          # Semantic inventory search (SKY-70): forwards the repo-level
          # embedding secrets into the ai-agent container via compose
          # interpolation. When the secrets are unset (empty), the ai-agent
          # boots with embeddings disabled and search degrades to exact-only.
          AI_EMBEDDING_PROVIDER: ${{ secrets.AI_EMBEDDING_PROVIDER }}
          AI_EMBEDDING_API_KEY: ${{ secrets.AI_EMBEDDING_API_KEY }}

      # ---- Seeds -----------------------------------------------------------
      - name: Wait for identity and seed database
        run: |
          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml exec -T identity \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for identity... ($i/60)"
            sleep 2
          done

          # Identity seed is idempotent: creates the default tenant + admin
          # user on first run and no-ops on re-runs.  --workdir is REQUIRED:
          # the image WORKDIR is /app, and Settings resolves the relative
          # .dev/keys/*.pem paths against the process CWD — the seed must
          # run from /app/services/identity exactly like the container boot
          # command does (uv run --directory services/identity ...). PYTHONPATH
          # is set in the container env and /app/.venv/bin is on PATH, so
          # plain `python` resolves both the src-layout packages and deps.
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T \
            --workdir /app/services/identity identity \
            python -m identity.seed
          echo "Seeded identity (default tenant + admin@skyrict.io)"

          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml exec -T core \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for core... ($i/60)"
            sleep 2
          done

          # Core seed populates the report catalog, leave-type catalogue,
          # roles, approvals, and finance chart for the default tenant.
          # Invoked through the typer CLI (core.cli): `python -m core.seed`
          # has no __main__ and is a silent no-op, which left erp_leave_types
          # empty until the payroll hire's accrual FK-violated (500).
          # The tenant UUID is the identity service's DEFAULT_TENANT_ID.
          # --workdir: same CWD rationale as the identity seed above.
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T \
            --workdir /app/services/core core \
            python -m core.cli seed \
            --tenant-id 00000000-0000-0000-0000-000000000001
          echo "Seeded core report catalog + HR/Payroll defaults"
        timeout-minutes: 10

      # ---- Enable the journal-entry approval engine ------------------------
      # SKY-92: the engine is OFF by default so existing ERP flows are
      # unchanged. The approval-interrupt AI journey opts this disposable
      # tenant in; journal entries below the seeded 10,000 threshold still
      # auto-approve, so every other finance journey is unaffected.
      - name: Enable journal-entry approval engine
        run: |
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T \
            -e PGPASSWORD=skyrict postgres \
            psql -U skyrict -d skyrict_identity -v ON_ERROR_STOP=1 -c "
              INSERT INTO erp_tenant_settings (tenant_id, id, key, value)
              SELECT '00000000-0000-0000-0000-000000000001', gen_random_uuid(), flag_key, 'true'
              FROM (VALUES ('approval_engine_enabled'), ('je_approval_engine')) AS flags(flag_key)
              WHERE NOT EXISTS (
                SELECT 1 FROM erp_tenant_settings s
                WHERE s.tenant_id = '00000000-0000-0000-0000-000000000001' AND s.key = flags.flag_key
              );
            "
          echo "Enabled approval_engine_enabled + je_approval_engine for default tenant"

      # ---- Build + start Next.js -------------------------------------------
      - name: Build web app
        run: pnpm --filter @skyrict/web build
        env:
          SESSION_COOKIE_SECURE: "false"

      - name: Start Next.js (production mode)
        # `next start` honors $PORT (set below), so we must NOT pass a
        # `-- -p 3100` arg through pnpm: pnpm appends the literal `--` to the
        # script argv, `next start` then treats `-p` as a positional project
        # directory and exits with "Invalid project directory provided".
        #
        # The probe hits /api/v1/health, a static Next route that answers 200
        # without touching a backend or requiring a session cookie. If it ever
        # fails again, fail fast with the server log + last response body so
        # the cause (404/500, rebind, process exit) is obvious instead of a
        # silent 90s timeout.
        run: |
          set -o pipefail

          pnpm --filter @skyrict/web start > /tmp/next.log 2>&1 &
          NEXT_PID=$!

          for i in $(seq 1 90); do
            if ! kill -0 "$NEXT_PID" 2>/dev/null; then
              echo "Next.js exited unexpectedly" >&2
              cat /tmp/next.log >&2
              exit 1
            fi

            status=$(curl -sS -o /tmp/health-response \
              -w "%{http_code}" \
              http://127.0.0.1:3100/api/v1/health || true)

            if [ "$status" = "200" ]; then
              echo "HEALTHY http://127.0.0.1:3100/api/v1/health"
              exit 0
            fi

            echo "Waiting for Next.js health endpoint ($i/90), HTTP status: $status"
            sleep 1
          done

          echo "TIMED OUT waiting for http://127.0.0.1:3100/api/v1/health after 90s" >&2
          echo "--- /tmp/next.log ---" >&2
          cat /tmp/next.log >&2 || true
          echo "--- /tmp/health-response ---" >&2
          cat /tmp/health-response 2>/dev/null || true
          exit 1
        env:
          SESSION_COOKIE_SECURE: "false"
          PORT: "3100"

      # ---- Playwright ------------------------------------------------------
      - name: Install Playwright browser
        run: pnpm --filter @skyrict/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @skyrict/web exec playwright test
        env:
          CI: "true"
          E2E_BASE_URL: "http://default.localhost:3000"
          E2E_SKIP_WEBSERVER: "1"
          SESSION_COOKIE_SECURE: "false"
          E2E_TENANT_SLUG: "default"
          E2E_ADMIN_EMAIL: "admin@skyrict.io"
          E2E_ADMIN_PASSWORD: "Admin123!"
          # True (1) only when BOTH embedding secrets are configured, so the
          # inventory spec asserts real hybrid results when the provider+key
          # are set together and the graceful exact-only degradation otherwise.
          # (A key without a provider stays disabled in ai-agent boot, so
          # gating on the pair keeps the assertion honest.)
          E2E_SEMANTIC_SEARCH: "${{ secrets.AI_EMBEDDING_PROVIDER != '' && secrets.AI_EMBEDDING_API_KEY != '' }}"

      # ---- Artifacts -------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 14

      # ---- Teardown --------------------------------------------------------
      - name: Teardown compose stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.e2e.yml down -v --remove-orphans