# Development overrides — extends docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: skyrict

  redis:
    ports:
      - "6379:6379"

  # Kafka deferred — see docker-compose.yml
  # kafka:
  #   ports:
  #     - "9092:9092"

  # ---------- Identity Service (dev target — live reload) ----------
  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
      target: dev
    container_name: skyrict-identity
    ports:
      - "8000:8000"
    env_file:
      - ../../services/identity/.env
    environment:
      ENVIRONMENT: dev
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      LOG_JSON: "false"
    volumes:
      - ../../services/identity/src:/app/services/identity/src
      - ../../libs/skyrict-common/src:/app/libs/skyrict-common/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------- Nginx (local multi-tenant routing) ----------
  # Routes *.localhost subdomains (and a path-based fallback) to the identity
  # service, injecting X-Tenant-Slug so tenant resolution behaves identically
  # to production. See infra/nginx/dev.conf.
  nginx:
    image: nginx:1.27-alpine
    container_name: skyrict-nginx
    ports:
      # Override the host port if 80 is in use: set NGINX_PORT=8080 in your .env
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../../infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------- pgAdmin (optional — dev only) ----------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skyrict-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skyrict.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    profiles:
      - debug
