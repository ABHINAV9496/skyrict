# Skyrict — Local Development Infrastructure
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
name: skyrict

services:
  # ---------- PostgreSQL (with pgvector extension for AI embeddings) ----------
  postgres:
    image: pgvector/pgvector:pg18
    container_name: skyrict-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: skyrict
      POSTGRES_PASSWORD: skyrict
      POSTGRES_DB: skyrict_identity
    volumes:
      # PG18 stores its cluster under /var/lib/postgresql/<major>/docker, so the
      # volume must mount at /var/lib/postgresql (not .../data like PG16).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -d matches the real database: without it pg_isready defaults to a db
      # named after the user ("skyrict") which doesn't exist, so every 5s poll
      # spams "FATAL: database 'skyrict' does not exist" into the logs.
      test: ["CMD-SHELL", "pg_isready -U skyrict -d skyrict_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:8-alpine
    container_name: skyrict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Mailpit (dev SMTP sink — capture outbound email) ----------
  # Web UI at http://localhost:8025, SMTP relay on 1025. Drop-in replacement for
  # the abandoned MailHog; actively maintained, faster, full-text search.
  mailpit:
    image: axllent/mailpit:latest
    container_name: skyrict-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------- Kafka (KRaft mode — no Zookeeper) ----------
  # Kafka is intentionally DEFERRED until 3+ services need decoupled async
  # events (there is currently one real service). Uncomment this service and
  # the kafka_data volume below when it is brought into scope.
  # kafka:
  #   image: bitnami/kafka:3.7
  #   container_name: skyrict-kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_CFG_NODE_ID: 1
  #     KAFKA_CFG_PROCESS_ROLES: controller,broker
  #     KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  #     KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  #     KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_CFG_LOG_RETENTION_HOURS: 168
  #   volumes:
  #     - kafka_data:/bitnami/kafka

volumes:
  postgres_data:
  redis_data:
  # kafka_data:
