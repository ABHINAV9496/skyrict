apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-health
  namespace: skyrict-staging
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: skyrict
    environment: staging
  annotations:
    # Expose the documented staging health URL https://<tenant>.staging.skyrict.com/health
    # which the identity service serves at /api/v1/health.
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/health
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: "*.staging.skyrict.com"
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: identity
                port:
                  name: http
