apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every staging-specific value lives in this overlay - nothing staging-related
# is hardcoded outside infra/k8s/overlays/staging/.
#
# Each namespaced resource declares its own metadata.namespace (repo
# convention); there is deliberately no top-level `namespace:` field because
# the overlay also contains the cluster-scoped ClusterIssuer and the offline
# kustomize build would wrongly namespace it.

resources:
  - namespace.yaml
  - identity/deployment.yaml
  - identity/service.yaml
  - identity/ingress.yaml
  - identity/ingress-health.yaml
  - identity/ingress-ready.yaml
  - cert-manager/certificate.yaml
  - cert-manager/cluster-issuer.yaml
