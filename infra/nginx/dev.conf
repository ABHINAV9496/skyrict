# =============================================================================
# Skyrict — local multi-tenant routing (DEV ONLY)
#
# Routes local requests to the identity service and injects the
# X-Tenant-Slug header so tenant resolution behaves identically to
# production, where a request arrives at https://acme.skyrict.com/... and
# the ingress derives the tenant slug from the subdomain.
#
# Two local entry points:
#   1. Subdomain route (primary)      http://acme.localhost/...
#      -> identity with X-Tenant-Slug: acme
#   2. Path fallback (no wildcard DNS) http://localhost/acme/...
#      -> identity with X-Tenant-Slug: acme and the tenant segment stripped
#
# The client-supplied X-Tenant-Slug header (if any) is always overwritten —
# the slug is derived from the subdomain / path, never trusted from input.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by the `nginx` service
# in infra/docker/docker-compose.dev.yml.
# =============================================================================

# Access log that shows the tenant context so `docker logs skyrict-nginx`
# makes per-subdomain routing visible.
log_format skyrict_dev '$remote_addr - $host "$request" $status '
                       'tenant_slug="$tenant_slug"';

# ---------------------------------------------------------------------------
# 1) Subdomain route: *.localhost
#    Mirrors production tenant subdomains (acme.skyrict.com). The first
#    label is captured and forwarded as X-Tenant-Slug; the request path is
#    passed through unchanged.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ~^(?<tenant_slug>[a-z0-9-]+)\.localhost$;

    access_log /dev/stdout skyrict_dev;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Derived from the subdomain — never trusts a client-supplied header.
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_pass http://identity:8000;
    }
}

# ---------------------------------------------------------------------------
# 2) Path fallback: localhost/{tenant_slug}/...
#    For environments where wildcard *.localhost is unavailable. The first
#    path segment is captured, forwarded as X-Tenant-Slug, and stripped from
#    the upstream path:
#      http://localhost/acme/login          -> /api/v1/auth/login + X-Tenant-Slug: acme
#      http://localhost/acme/api/v1/health  -> /api/v1/health + X-Tenant-Slug: acme
#    Reserved top-level service paths (api, docs, redoc) are excluded so
#    un-prefixed requests such as /api/v1/health pass through unchanged.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name localhost;

    # Fallback for requests with no tenant prefix (health, docs, ...).
    access_log /dev/stdout skyrict_dev;

    # /{tenant}/login maps to the identity login API so the documented
    # fallback example works against the real endpoint.
    location ~ ^/(?!api/|docs/|redoc/)(?<tenant_slug>[a-z0-9-]+)/login$ {
        access_log /dev/stdout skyrict_dev;

        rewrite ^ /api/v1/auth/login break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_pass http://identity:8000;
    }

    # /{tenant}/{rest} -> /{rest} with the tenant header.
    location ~ ^/(?!api/|docs/|redoc/)(?<tenant_slug>[a-z0-9-]+)/(?<tenant_path>.*)$ {
        access_log /dev/stdout skyrict_dev;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_pass http://identity:8000/$tenant_path$is_args$args;
    }

    # Everything else passes through unchanged (no tenant header).
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://identity:8000;
    }
}
