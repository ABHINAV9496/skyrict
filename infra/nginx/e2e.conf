# =============================================================================
# Skyrict - E2E test routing (CI only)
#
# ALL traffic reaches Next.js on the host (host.docker.internal:3100). Unlike
# the dev conf which splits /api/* to identity directly, the E2E conf keeps
# the full BFF path: Next.js handles /api/auth/* itself and proxies /api/v1/*
# to the backends. This is the same boundary a real browser hits in prod.
#
# Tenant isolation: {slug}.localhost → Next.js with X-Tenant-Slug header.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by the `nginx` service
# in infra/docker/docker-compose.e2e.yml.
# =============================================================================

log_format skyrict_e2e '$remote_addr - $host "$request" $status '
                       'tenant_slug="$tenant_slug"';

server {
    listen 80;
    server_name ~^(?<tenant_slug>[a-z0-9-]+)\.localhost$;

    access_log /dev/stdout skyrict_e2e;

    # Direct health endpoint for the container healthcheck and the CI wait
    # step - served by nginx itself, never proxied, so it succeeds as soon
    # as nginx is up (Next.js may still be booting on :3100).
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    location / {
        # $http_host (not $host) preserves the browser's `:3000` port. Next.js
        # derives the external origin from the Host header; a portless Host makes
        # it advertise its own internal :3100 and the browser bypasses nginx, so
        # the auth handoff POST to {slug}.localhost:3000 is blocked by the
        # form-action CSP.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80 default_server;
    server_name localhost;

    access_log /dev/stdout skyrict_e2e;

    # Default-localhost surface (marketing pages) -> Next.js directly. No
    # tenant slug exists on the bare-localhost origin, so no header is set.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    location / {
        # Same Host-port preservation as the tenant block above.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}