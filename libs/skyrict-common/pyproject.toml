[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyrict-common"
version = "0.1.0"
description = "Shared utilities, exceptions, and response envelopes for Skyrict services"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Skyrict Contributors" },
]
dependencies = [
    "pydantic>=2.7,<3",
    "structlog>=24.0,<25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skyrict_common"]
