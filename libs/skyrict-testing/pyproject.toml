[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyrict-testing"
version = "0.1.0"
description = "Shared test utilities — fixtures, factories, and helpers for Skyrict services"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Skyrict Contributors" },
]
dependencies = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "factory-boy>=3.3,<4",
    "pydantic>=2.7,<3",
    "skyrict-common",
]

[project.optional-dependencies]
postgres = [
    "testcontainers[postgres]>=4.0,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
]
sqlite = [
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]
all = [
    "skyrict-testing[postgres,sqlite]",
]

[tool.uv.sources]
skyrict-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/skyrict_testing"]
