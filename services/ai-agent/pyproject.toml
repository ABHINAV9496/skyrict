[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent"
version = "0.1.0"
description = "Skyrict AI agent service — provider-agnostic LLM routing, inventory AI features, shared AI tables, audit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Skyrict Contributors" },
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    "pgvector>=0.3,<1",
    "tiktoken>=0.8,<1",
    "skyrict-common",
    "structlog>=24.0,<25",
    "typer>=0.12,<1",
]

[project.scripts]
ai-agent = "ai_agent.cli:app"

[tool.uv.sources]
skyrict-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require Docker services)",
    "slow: Tests that take more than 5 seconds",
]

[tool.coverage.run]
source = ["src/ai_agent"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

# Ruff / mypy config intentionally lives in the ROOT pyproject.toml (with the
# per-file-ignores for ai_agent paths) — mirroring services/core.
