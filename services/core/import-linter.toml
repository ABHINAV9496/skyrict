# Core service import-linter configuration - enforced architecture.
#
# Run from the repo root:
#   uv run import-linter --config services/core/import-linter.toml
#
# Mirrors services/identity (root pyproject.toml) but scoped to the core
# package so the two services' contracts can evolve independently.

[tool.importlinter]
root_package = "core"
include_external_packages = false
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Foundations never depend on features or api"
type = "forbidden"
source_modules = [
    "core.core",
    "core.db",
    "core.models",
    "core.domain",
    "core.events",
]
forbidden_modules = ["core.features", "core.api"]

[[tool.importlinter.contracts]]
name = "Only repositories touch the database layer"
type = "forbidden"
source_modules = ["core.features"]
forbidden_modules = ["core.models", "core.db"]
# Feature ORM MODELS are the one sanctioned exception: they must inherit the
# shared declarative Base/mixins from core.models.base (identity convention -
# no db/base.py), so importing core.models.** from features/**/models/** is
# allowed. Repositories and everything else under core.features stay forbidden.
ignore_imports = [
    "core.features.**.models.** -> core.models.**",
    "core.features.inventory.models.** -> core.models.base",
    # payroll_automation/model.py is a single-file feature ORM models module
    # (not a models/ package), so it isn't caught by the generic models glob;
    # it needs the shared declarative Base/mixins like every other feature model.
    "core.features.payroll_automation.models -> core.models.base",
    # notifications_repository joins the shared identity RBAC tables (role +
    # user_role) to resolve which users hold the payroll-notification
    # permission. Repositories are the sanctioned ORM gateway, so these
    # shared-model imports are allowed.
    "core.features.payroll_automation.notifications_repository -> core.models.core_role",
    "core.features.payroll_automation.notifications_repository -> core.models.core_user_role",
]
# Repositories are the ORM gateway: services/routers/schemas must never import
# SQLAlchemy models or the db layer directly. Persistence stays in repository.py.
# Feature ORM models live under core.features.<module>.models and legitimately
# need the shared declarative Base/mixins from core.models.base.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["core.domain"]
forbidden_modules = ["core.models", "core.db", "core.features", "core.api"]

[[tool.importlinter.contracts]]
name = "API never touches ORM models"
type = "forbidden"
source_modules = ["core.api"]
forbidden_modules = ["core.models"]
# Direct-import only: api.deps legitimately wires repositories (which touch
# models) as the composition root, so indirect chains are not flagged.
allow_indirect_imports = true
